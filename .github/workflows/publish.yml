name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools and test dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Build package
        run: python -m build

      - name: Verify wheel installs cleanly
        run: |
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/pip install dist/spandrift-*.whl
          /tmp/verify-venv/bin/spandrift --help
          /tmp/verify-venv/bin/python -c "from spandrift import __version__; print(f'spandrift {__version__}')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/spandrift
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses Trusted Publishing (OIDC) — no PYPI_API_TOKEN needed.
        # Configure the trusted publisher on PyPI's side:
        #   Owner: arv20
        #   Repository: spandrift
        #   Workflow: publish.yml
        #   Environment: pypi
