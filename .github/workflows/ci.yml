name: Spandrift CI Gate

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -v

  trace-regression-gate:
    name: Trace Regression Gate (spandrift diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install spandrift
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
      - name: Run Benchmark / Generate Traces
        run: |
          # Generate base and head traces or download benchmark artifacts
          python demo/run_demo.py
      - name: Check Cost and Latency Regressions
        run: |
          spandrift diff \
            demo/base_trace.json \
            demo/head_trace.json \
            --cost-threshold 0.10 \
            --latency-threshold 0.20 \
            --exit-code
