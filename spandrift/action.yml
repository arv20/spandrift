name: "Spandrift Trace Analysis & Diff Gate"
description: "Analyzes execution traces from multi-agent LLM systems, posts formatted regression diffs to PR reviews, and enforces cost/latency gating."
author: "Spandrift"
branding:
  icon: "activity"
  color: "blue"

inputs:
  base_trace:
    description: "Path to baseline OTLP trace JSON file (e.g. from main branch)"
    required: true
  head_trace:
    description: "Path to PR/head OTLP trace JSON file (e.g. from current run)"
    required: true
  cost_threshold:
    description: "Cost regression threshold as a fraction (e.g. 0.10 for 10%)"
    required: false
    default: "0.10"
  latency_threshold:
    description: "Latency regression threshold as a fraction (e.g. 0.20 for 20%)"
    required: false
    default: "0.20"
  html_output:
    description: "Optional path to export an HTML report"
    required: false
    default: "spandrift-report.html"
  github_token:
    description: "GitHub Token for posting PR comments (e.g. secrets.GITHUB_TOKEN)"
    required: false
    default: "${{ github.token }}"
  comment_pr:
    description: "Whether to post/update a summary comment on the Pull Request"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Spandrift
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install spandrift

    - name: Analyze Head Trace
      shell: bash
      run: |
        spandrift analyze "${{ inputs.head_trace }}" --html "${{ inputs.html_output }}"

    - name: Run Spandrift Diff & Generate Report
      id: diff_step
      shell: bash
      run: |
        set +e
        DIFF_OUTPUT=$(spandrift diff \
          "${{ inputs.base_trace }}" \
          "${{ inputs.head_trace }}" \
          --cost-threshold "${{ inputs.cost_threshold }}" \
          --latency-threshold "${{ inputs.latency_threshold }}" \
          --no-exit-code)
        
        EXIT_CODE=$?
        
        # Save to environment for PR comment
        echo "DIFF_REPORT<<EOF" >> $GITHUB_ENV
        echo "$DIFF_OUTPUT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Post PR Review Comment
      if: inputs.comment_pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const diffOutput = process.env.DIFF_REPORT;
          const body = `### 🛰️ Spandrift Trace Regression Report\n\n\`\`\`text\n${diffOutput}\n\`\`\`\n\n*Thresholds: Cost +${Number("${{ inputs.cost_threshold }}") * 100}%, Latency +${Number("${{ inputs.latency_threshold }}") * 100}%*`;
          
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('Spandrift Trace Regression Report')
          );
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
          }

    - name: Enforce Threshold Gating
      shell: bash
      run: |
        spandrift diff \
          "${{ inputs.base_trace }}" \
          "${{ inputs.head_trace }}" \
          --cost-threshold "${{ inputs.cost_threshold }}" \
          --latency-threshold "${{ inputs.latency_threshold }}" \
          --exit-code
