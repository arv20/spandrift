name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Verify package contents
        run: |
          pip install dist/spandrift-*.whl
          spandrift --help
          # Confirm the CLI entry point works from a clean wheel install
          python -c "from spandrift import __version__; print(f'spandrift {__version__}')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spandrift
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses Trusted Publishing (OIDC) — no PYPI_API_TOKEN needed.
        # Configure the trusted publisher on PyPI's side:
        #   Owner: arv20
        #   Repository: opensourceproject
        #   Workflow: publish.yml
        #   Environment: pypi
